<div class="auth-shell" [class.auth-shell--full]="fullBleed">
  <button
    type="button"
    class="theme-fab"
    (click)="toggleTheme()"
    [attr.aria-label]="theme === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    [title]="theme === 'oscuro' ? 'Tema claro' : 'Tema oscuro'"
  >
    {{ theme === 'oscuro' ? '☀' : '☾' }}
  </button>

  <aside
    class="auth-visual"
    [class.auth-visual--banner]="fullBleed"
    [class.suma-banner-slot]="fullBleed"
    data-particles
    [attr.data-density]="fullBleed ? '0.85' : '1.35'"
    [attr.data-speed]="fullBleed ? '1' : '1.08'"
    data-color="#c9a227"
    data-link="#d4af37"
  >
    <ng-container *ngIf="fullBleed; else loginVisual">
      <div class="suma-banner-brand suma-banner-brand--shell" aria-label="SUMA · Aduana Nacional">
        <span class="suma-banner-eyebrow">Aduana Nacional</span>
        <h1 class="suma-banner-title">SUMA</h1>
        <p class="suma-banner-sub">Sistema Único de Modernización Aduanera</p>
      </div>
      <div class="bolivia-map-frame bolivia-map-frame--portal" aria-hidden="true">
        <object
          class="bolivia-svg"
          data="/assets/img/bolivia-departments-outline.svg?v=1"
          type="image/svg+xml"
          tabindex="-1"
        ></object>
      </div>
      <div class="suma-banner-aduana-logo" aria-label="Aduana Nacional">
        <img
          class="suma-banner-aduana-logo__img suma-banner-aduana-logo__img--color"
          src="/assets/img/logo-aduana-color.png"
          alt="Aduana Nacional"
          width="220"
          height="74"
        />
        <img
          class="suma-banner-aduana-logo__img suma-banner-aduana-logo__img--blanco"
          src="/assets/img/logo-aduana-blanco.png"
          alt="Aduana Nacional"
          width="220"
          height="89"
        />
      </div>
    </ng-container>

    <ng-template #loginVisual>
      <div class="auth-brand" aria-label="SUMA · Aduana Nacional">
        <p class="auth-brand-eyebrow">Aduana Nacional</p>
        <h1 class="auth-brand-title">SUMA</h1>
        <p class="auth-brand-sub">Sistema Único de Modernización Aduanera</p>
      </div>

      <div class="banner-info-tabs banner-info-tabs--hero">
        <div class="banner-info-tablist" role="tablist" aria-label="Información SUMA">
          <button
            type="button"
            class="banner-info-tab"
            role="tab"
            [class.is-active]="bannerTab === 'firma'"
            [attr.aria-selected]="bannerTab === 'firma'"
            (click)="setBannerTab('firma')"
          >
            <span class="banner-info-tab-kicker">01</span>
            <span class="banner-info-tab-title">Firma digital</span>
            <span class="banner-info-tab-desc">Puntos habilitados para adquirir la firma digital</span>
          </button>
          <button
            type="button"
            class="banner-info-tab"
            role="tab"
            [class.is-active]="bannerTab === 'soporte'"
            [attr.aria-selected]="bannerTab === 'soporte'"
            (click)="setBannerTab('soporte')"
          >
            <span class="banner-info-tab-kicker">02</span>
            <span class="banner-info-tab-title">Soporte</span>
            <span class="banner-info-tab-desc">Consulta, ticket y respuesta en su correo</span>
          </button>
          <button
            type="button"
            class="banner-info-tab"
            role="tab"
            [class.is-active]="bannerTab === 'seguimiento'"
            [attr.aria-selected]="bannerTab === 'seguimiento'"
            (click)="setBannerTab('seguimiento')"
          >
            <span class="banner-info-tab-kicker">03</span>
            <span class="banner-info-tab-title">Seguimiento</span>
            <span class="banner-info-tab-desc">Consulte el estado de su ticket de soporte</span>
          </button>
        </div>

        <div class="banner-info-panels">
          <div
            class="bolivia-map-frame"
            role="tabpanel"
            *ngIf="bannerTab === 'firma'"
            aria-label="Puntos habilitados para firma digital"
          >
            <object
              class="bolivia-svg"
              data="/assets/img/bolivia-departments.svg?v=8"
              type="image/svg+xml"
              tabindex="-1"
            ></object>
          </div>
          <div
            class="soporte-autoformas-frame"
            role="tabpanel"
            *ngIf="bannerTab === 'soporte'"
            aria-label="Soporte sistemas"
          >
            <object
              class="soporte-svg"
              data="/assets/img/soporte-autoformas.svg?v=2"
              type="image/svg+xml"
              tabindex="-1"
            ></object>
          </div>
          <div
            class="seguimiento-frame"
            role="tabpanel"
            *ngIf="bannerTab === 'seguimiento'"
            aria-label="Seguimiento solicitud de soporte"
          >
            <object
              class="seguimiento-svg"
              data="/assets/img/seguimiento-engranajes.svg?v=2"
              type="image/svg+xml"
              tabindex="-1"
            ></object>
          </div>
        </div>
      </div>
    </ng-template>
  </aside>

  <main
    class="auth-panel"
    [class.auth-panel--full]="fullBleed"
    data-particles
    [attr.data-density]="fullBleed ? '0.7' : '0.55'"
    data-speed="1"
    data-color="#c9a227"
    data-link="#d4af37"
  >
    <router-outlet></router-outlet>
  </main>
</div>

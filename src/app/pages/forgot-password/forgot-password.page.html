<section class="auth-full auth-full--compact">
  <div class="auth-full__inner">
    <header class="auth-full__head auth-full__head--simple">
      <div class="kc-head kc-head--compact">
        <span class="kc-logo kc-logo--sm" aria-hidden="true">?</span>
        <div>
          <h2>¿Olvidó su contraseña?</h2>
          <p class="sub">Ingrese su correo y usuario para recibir el enlace de recuperación</p>
        </div>
      </div>
    </header>

    <ng-container *ngIf="!successMsg; else okTpl">
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-full__form mat-auth-form" autocomplete="on">
        <mat-form-field appearance="outline" class="mat-auth-field" subscriptSizing="dynamic">
          <mat-label><span class="req">*</span> Correo electrónico</mat-label>
          <input matInput id="fpEmail" type="email" formControlName="email" autocomplete="email" />
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="mat-auth-field" subscriptSizing="dynamic">
          <mat-label><span class="req">*</span> Nombre de usuario</mat-label>
          <input matInput id="fpUser" formControlName="nombreUsuario" autocomplete="username" />
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        <div class="captcha-row captcha-row--compact">
          <img class="captcha-box" [src]="captchaSrc" alt="Captcha" width="120" height="40" />
          <button
            mat-icon-button
            type="button"
            class="captcha-refresh"
            (click)="refreshCaptcha()"
            title="Otro captcha"
            aria-label="Generar otro captcha"
          >
            <mat-icon>refresh</mat-icon>
          </button>
          <mat-form-field appearance="outline" class="mat-auth-field" subscriptSizing="dynamic">
            <mat-label><span class="req">*</span> Código</mat-label>
            <input matInput id="fpCaptcha" formControlName="captcha" autocomplete="off" maxlength="5" />
            <mat-icon matPrefix>pin</mat-icon>
          </mat-form-field>
        </div>

        <p class="otp-error" *ngIf="error" role="alert">{{ error }}</p>

        <div class="auth-actions-mat auth-actions-mat--row">
          <a mat-button routerLink="/login">
            <mat-icon>arrow_back</mat-icon>
            Volver
          </a>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading">
            <mat-icon>send</mat-icon>
            {{ loading ? 'Enviando…' : 'Enviar' }}
          </button>
        </div>
      </form>
    </ng-container>

    <ng-template #okTpl>
      <div class="mfa-banner">
        <strong>Solicitud enviada</strong>
        <span>{{ successMsg }}</span>
      </div>
      <div class="auth-actions-mat">
        <a mat-flat-button color="primary" routerLink="/login">
          <mat-icon>login</mat-icon>
          Volver al login
        </a>
      </div>
    </ng-template>
  </div>
</section>

<div class="hub-page">
  <header class="shell-top">
    <div class="top-left">
      <div>
        <div class="crumb">SUMA · No habituales</div>
        <strong class="top-perfil">Elija una opción para continuar</strong>
      </div>
    </div>
    <div class="top-right">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="theme === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        [title]="theme === 'oscuro' ? 'Tema claro' : 'Tema oscuro'"
      >
        {{ theme === 'oscuro' ? '☀' : '☾' }}
      </button>
      <span class="chip">Captcha · verificado</span>
      <button type="button" class="btn-soft" (click)="logout()">Salir</button>
    </div>
  </header>

  <main class="hub-main">
    <div class="page-head">
      <div>
        <h1>Importadores / Exportadores no habituales</h1>
        <p>
          Dos accesos: registrar un nuevo operador (portal SUMA) u operaciones no habituales
          (DIMS, manifiestos, impresión, notificación y más).
        </p>
      </div>
    </div>

    <div class="hub-grid">
      <button type="button" class="hub-card" (click)="goRegistro()">
        <span class="tag"><span class="ord">1</span> Registro</span>
        <h2>Registrar nuevo operador</h2>
        <p>
          Alta de importador / exportador en el portal SUMA (equivalente al registro de nuevos
          operadores del SSO).
        </p>
        <span class="go">Ir al portal SUMA →</span>
      </button>

      <button type="button" class="hub-card" (click)="goOps()">
        <span class="tag"><span class="ord">2</span> Operaciones</span>
        <h2>Operaciones no habituales</h2>
        <p>
          Importación y exportación: DIMS, permiso ocasional, impresión, notificación, agencia
          marítima, valija, socorro, DAV y más.
        </p>
        <span class="go">Ver opciones →</span>
      </button>
    </div>
  </main>
</div>

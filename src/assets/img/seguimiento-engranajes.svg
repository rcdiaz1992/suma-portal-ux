<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 420" class="seguimiento-svg" role="img" aria-label="Seguimiento solicitud de soporte">
  <style>
    .bg { fill: #0a3a72; }
    .bg-gear {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 4;
    }
    .conn {
      fill: none;
      stroke: #a6ce39;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sgDraw 1.1s ease forwards;
      animation-delay: 0.15s;
    }
    .gear-body {
      fill-opacity: 0;
      fill-rule: evenodd;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linejoin: miter;
      stroke-linecap: butt;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sgDraw 1.25s cubic-bezier(0.4,0,0.2,1) forwards,
                 sgFill 0.5s ease calc(var(--sg-delay, 0s) + 1s) forwards;
      animation-delay: var(--sg-delay, 0s), calc(var(--sg-delay, 0s) + 1s);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.28));
    }
    .gear-rim {
      fill: none;
      stroke: rgba(255,255,255,0.35);
      stroke-width: 2;
      opacity: 0;
      animation: sgFade 0.4s ease forwards;
      animation-delay: calc(var(--sg-delay, 0s) + 1.15s);
    }
    .g1 { fill: #a6ce39; }
    .g2 { fill: #2f7fc4; }
    .g3 { fill: #163f72; }
    .gear-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: sgSpin 18s linear infinite;
      animation-delay: calc(var(--sg-delay, 0s) + 1.5s);
    }
    .gear-spin--rev {
      animation-direction: reverse;
      animation-duration: 20s;
    }
    .gear-label-bg {
      opacity: 0;
      fill: rgba(6, 22, 48, 0.82);
      stroke: rgba(255,255,255,0.55);
      stroke-width: 2;
      animation: sgFade 0.45s ease forwards;
      animation-delay: calc(var(--sg-delay, 0s) + 1.2s);
    }
    .gear-text {
      opacity: 0;
      fill: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      text-anchor: middle;
      paint-order: stroke fill;
      stroke: rgba(4, 16, 36, 0.85);
      stroke-width: 3.5px;
      stroke-linejoin: round;
      animation: sgFade 0.5s ease forwards;
      animation-delay: calc(var(--sg-delay, 0s) + 1.3s);
    }
    .gear-caption {
      opacity: 0;
      fill: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      text-anchor: middle;
      paint-order: stroke fill;
      stroke: rgba(4, 16, 36, 0.75);
      stroke-width: 3px;
      animation: sgFade 0.5s ease forwards;
      animation-delay: calc(var(--sg-delay, 0s) + 1.35s);
    }
    .c1 { fill: #d7f06a; }
    .c2 { fill: #9fd0ff; }
    .c3 { fill: #c9e2ff; }
    .title {
      opacity: 0;
      fill: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-anchor: start;
      animation: sgFade 0.55s ease forwards;
      animation-delay: 3.2s;
    }
    .divider {
      stroke: rgba(255,255,255,0.35);
      stroke-width: 2;
      opacity: 0;
      animation: sgFade 0.45s ease forwards;
      animation-delay: 3s;
    }
    .cta {
      opacity: 0;
      animation: sgFade 0.55s ease forwards;
      animation-delay: 3.45s;
    }
    .cta-btn {
      fill: #a6ce39;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28));
    }
    .cta-plus-bg { fill: #ffffff; }
    .cta-plus { fill: none; stroke: #1a4f8a; stroke-width: 3.2; stroke-linecap: round; }
    .cta-label {
      fill: #0b3a6e;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    @keyframes sgDraw { to { stroke-dashoffset: 0; } }
    @keyframes sgFill { to { fill-opacity: 1; } }
    @keyframes sgFade { to { opacity: 1; } }
    @keyframes sgSpin { to { transform: rotate(360deg); } }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="420" rx="18"/>


# Portal SUMA UX — la entrada del portal es el login Angular (/login).
# El router Angular ya redirige '' y ** → login.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html/demo;
  index index.html;

  # Entrada del portal: siempre al front Angular (login).
  location = / {
    return 302 /login;
  }

  # Compat: si alguien llega a rutas viejas del SSO en este host, mandar al login.
  location = /sso/indexLogin.html {
    return 302 /login;
  }
  location = /sso/indexOce.html {
    return 302 /login;
  }

  # SPA: cualquier ruta de Angular (login, portal, registro, …)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API b-sso: en despliegue real suele ir por el gateway; en local usamos proxy de ng serve.
}
